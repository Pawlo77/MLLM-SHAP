[project]
name = "mllm-shap"
version = "0.6.0"
description = "Shapley-value attributions for conversational language models."
readme = "README.md"
requires-python = ">=3.12"  # no upper bound: CI tests 3.12 to 3.14; optional extras may lag
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
  { name = "Paweł Pozorski", email = "pozorski.paul@gmail.com" },
]
maintainers = [
  { name = "Paweł Pozorski", email = "pozorski.paul@gmail.com" },
]

keywords = [
  "explainability",
  "llms",
  "multimodal",
  "nlp",
  "shapley-value",
  "xai",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "logging518>=1.0.0,<2.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
]

[project.scripts]
mllm-shap = "mllm_shap.cli:main"

[project.urls]
Homepage = "https://github.com/Pawlo77/MLLM-SHAP"
Documentation = "https://pawlo77.github.io/MLLM-SHAP/"
Repository = "https://github.com/Pawlo77/MLLM-SHAP"
Issues = "https://github.com/Pawlo77/MLLM-SHAP/issues"

[project.entry-points."mllm_shap.estimators"]
exact = "mllm_shap.estimation.exact:ExactEstimator"
mc = "mllm_shap.estimation.monte_carlo:MonteCarloEstimator"
complementary = "mllm_shap.estimation.complementary:ComplementaryEstimator"
neyman_cc = "mllm_shap.estimation.neyman:NeymanEstimator"
loo = "mllm_shap.estimation.loo:LeaveOneOutEstimator"

[project.entry-points."mllm_shap.estimands"]
shapley = "mllm_shap.estimation.estimands.shapley:ShapleyAggregator"
banzhaf = "mllm_shap.estimation.estimands.banzhaf:BanzhafAggregator"

[project.entry-points."mllm_shap.partitions"]
tokens = "mllm_shap.masking.partitions:TokenPartitioner"
messages = "mllm_shap.masking.partitions:MessagePartitioner"
sgpa_segments = "mllm_shap.alignment.partitions:SgpaSegmentPartitioner"

[project.entry-points."mllm_shap.absence_policies"]
delete = "mllm_shap.masking.policies:DeletePolicy"
pad = "mllm_shap.masking.policies:PadPolicy"
neutral = "mllm_shap.masking.policies:NeutralPolicy"

[project.entry-points."mllm_shap.value_fns"]
tfidf_cosine = "mllm_shap.value.tfidf:TfIdfCosineValue"
embedding_cosine = "mllm_shap.value.embedding:CosineEmbeddingValue"
embedding_euclidean = "mllm_shap.value.embedding:EuclideanEmbeddingValue"
logprob = "mllm_shap.value.logprob:LogprobValue"
reference_wer = "mllm_shap.value.wer:ReferenceWerValue"

[project.entry-points."mllm_shap.normalizers"]
identity = "mllm_shap.estimation.normalizers:IdentityNormalizer"
abs_sum = "mllm_shap.estimation.normalizers:AbsSumNormalizer"
power_shift = "mllm_shap.estimation.normalizers:PowerShiftNormalizer"
min_max = "mllm_shap.estimation.normalizers:MinMaxNormalizer"

[project.entry-points."mllm_shap.backends"]
mock = "mllm_shap.backends.mock:MockBackend"
mock_audio = "mllm_shap.backends.mock:MockAudioBackend"
lmstudio = "mllm_shap.backends.lmstudio:LmStudioBackend"
transformers = "mllm_shap.backends.transformers.text:TransformersTextBackend"
api = "mllm_shap.backends.api:ApiBackend"

[project.entry-points."mllm_shap.renderers"]
token_text = "mllm_shap.viz.token_text:TokenTextRenderer"
token_bar = "mllm_shap.viz.token_bar:TokenBarRenderer"

[project.optional-dependencies]
lmstudio = [
    "lmstudio>=1.5.0",
]
# torchaudio and peft: audio language models; Granite Speech's feature extractor
# needs torchaudio and its audio LoRA adapter needs peft.
transformers = [
    "accelerate>=1.0.0",
    "peft>=0.17.0",
    "torch>=2.5.0",
    "torchaudio>=2.9.0",
    "transformers>=4.56.0",
]
api = [
    "httpx>=0.28.0",
]
# Audio decoding (soundfile) and boundary refinement and resampling (librosa) for
# mllm_shap.alignment; the Wav2Vec2 model itself comes from the transformers extra.
audio = [
    "librosa>=0.11.0",
    "soundfile>=0.13.0",
]
viz = [
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "ipywidgets>=8.1.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "hypothesis>=6.168.0",
  "ipykernel>=7.3.0",
  "mutmut>=3.8.0",
  "mypy>=2.4.0",
  "nbconvert>=7.17.1",
  "prek>=0.5.5",
  "pytest>=8.4.2",
  "pytest-benchmark>=5.3.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.10",
  "furo>=2024.8.6",
  "myst-nb>=1.3.0",
  "sphinx>=9.1.0",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.1",
  "types-pyyaml>=6.0.12.20250915",
  "scikit-learn>=1.7.0",
  "ty>=0.0.85",
]

[tool.uv.build-backend]
source-exclude = ["**/AGENTS.md", "**/CLAUDE.md"]

[tool.uv]
required-version = ">=0.12.23"

[tool.ruff]
target-version = "py312"
line-length = 88
# Generated rules, the vault and skill Markdown hold Python fences that
# ``ruff format`` must not rewrite; the vendored skill stays as upstream ships it.
# Our own skill scripts (.agents/skills/*/scripts) are linted.
extend-exclude = [
  ".claude/rules",
  "knowledge",
  ".agents/skills/caveman",
  ".agents/**/*.md",
]

[tool.ruff.lint]
select = [
  "B", "E", "F", "I", "N", "RUF", "SIM", "T10", "UP",
  "D", "PT", "PTH", "TRY", "PERF", "FURB", "ARG", "C4", "ISC", "RET",
  "C901", "PLR0915",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ARG"]
"docs/**" = ["D", "ARG", "PTH"]
# Existing size; new code must fit the budget.
"src/mllm_shap/pipeline/orchestrator.py" = ["PLR0915"]
"src/mllm_shap/pipeline/reanalyze.py" = ["PLR0915"]
"src/mllm_shap/estimation/complementary.py" = ["PLR0915"]
"scripts/knowledge_extra.py" = ["C901"]
".agents/skills/plugin/scripts/new_plugin.py" = ["PLR0915"]

[tool.ruff.format]
preview = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["mllm_shap"]
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["logging518", "logging518.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lmstudio"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "seaborn", "IPython", "IPython.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["httpx", "httpx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "transformers"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [".venv", "tests", "docs/_build", "examples", ".cursor"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
filterwarnings = [
]
markers = [
  "bench: local performance benchmark (run with make bench)",
  "lms: LM Studio integration test (requires local LM Studio with qwen2-500m-instruct)",
  "gpu: transformers integration test (requires torch and optional GPU)",
  "slow: builds a wheel or reaches the network (make tests-all, not make tests)",
  "practical(feature): real model on a GPU (make practical TIER=quick|deep FEATURE=<glob>)",
]

[tool.codespell]
ignore-words-list = "nlp,shapley,shap,explainability,pyproject,toml,venv,prek,autosummary,intersphinx,napoleon,myst,pydata,sdist,wheel,readonly,kwargs,args,init,utils,backend,frontend,untracked,workflow,workflows,pytest,cov"

[tool.agent-kit]
# Settings of the shared agent tooling (python-kit-template); read by scripts/ and hooks.
name = "mllm-shap"
tree-dirs = "src tests"  # the stop gate hashes these folders
vault-dirs = "knowledge"  # Markdown scanned for secrets and personal data
vault-check-args = "--quiet --strict-tags"  # session banner
vault-ci-args = "--strict --strict-tags"  # Prek Checks workflow
ci-sync-args = "--extra api --extra viz"  # extras the Prek Checks workflow installs

[tool.agent-kit.shell-guard]
ask-scripts = []
ask-patterns = [
  '^(uv\s+publish|twine\s+upload)\b',
  '^gh\s+release\s+create\b',
  '^gh\s+api\b.*(-X|--method)[\s=]+DELETE\b',
]

[tool.agent-kit.pr-policy]
routine-types = "chore ci build docs test style"
review-paths = ["src/mllm_shap/*"]
protected = [".github/workflows/publish.yaml"]
generated = ["uv.lock", ".obsidian/plugins/*/main.js", ".obsidian/plugins/*/styles.css"]
release = true

[tool.agent-kit.upgrade]
protected-workflows = ["publish.yaml"]
sync-args = "--all-groups --all-extras"

[tool.agent-kit.ship]
copilot = false  # no Copilot review requested or awaited

[tool.agent-kit.obsidian-plugins]
code-graph = "mrjw717/obsidian-code-graph"
mermaid-tools = "dartungar/obsidian-mermaid"
templater-obsidian = "silentvoid13/Templater"

[tool.agent-kit.brevity]
bullet-files = ["docs/release_notes.rst"]
skip-paths = ["docs/handbook", "docs/notebooks", "knowledge/generated"]

[[tool.agent-kit.brevity.budget]]
patterns = ["*/AGENTS.md"]
lines = 60

[[tool.agent-kit.brevity.budget]]
patterns = ["knowledge/issues/Fixed issues.md"]
words = 800
sentences = true

[[tool.agent-kit.brevity.budget]]
patterns = ["knowledge/decisions/*.md"]
words = 700
sentences = true

[[tool.agent-kit.brevity.budget]]
patterns = ["knowledge/issues/*.md"]
words = 350
sentences = true

[[tool.agent-kit.brevity.budget]]
patterns = ["knowledge/architecture/*.md", "knowledge/handbook/*.md"]
words = 700
sentences = true

[[tool.agent-kit.brevity.budget]]
patterns = ["knowledge/mllm-shap.md"]
words = 600
sentences = true

[[tool.agent-kit.brevity.budget]]
patterns = ["knowledge/*.md", "docs/release_notes.rst"]
sentences = true

[[tool.agent-kit.brevity.budget]]
patterns = ["examples/README.md"]
words = 400
sentences = true

[[tool.agent-kit.brevity.budget]]
patterns = ["docs/*.rst", "docs/*.md"]
words = 1200
sentences = true

[tool.agent-kit.configs]
delivery = "autopilot"
plugins = [
  "property-based-testing@trailofbits",
  "mutation-testing@trailofbits",
  "differential-review@trailofbits",
  "second-opinion@trailofbits",
  "claude-jit-context@dpt-plugins",
]
allow = [
  "Bash(make agent-check*)",
  "Bash(make docs*)",
  "Bash(make notebooks*)",
  "Bash(make bench*)",
  "Bash(uv run python scripts/*)",
  "Edit(docs/**)",
  "Edit(examples/**)",
  "Edit(knowledge/**)",
  "Write(knowledge/**)",
  "Bash(make knowledge*)",
]
deny = [
  "Read(./.pypirc)",
  "Read(**/id_rsa)",
  "Read(.smart-env/**)",
  "Read(.obsidian/plugins/realclaudian/data.json)",
  "Read(.claude/jit-context/.discovery/**)",
]

[tool.agent-kit.configs.marketplaces]
trailofbits = "trailofbits/skills"
dpt-plugins = "Digital-Process-Tools/claude-marketplace"

[tool.mutmut]
# ``make mutate`` (slow, on demand, not CI): mutate the estimation package and
# run only its tests against each mutant.
source_paths = ["src"]
only_mutate = ["src/mllm_shap/estimation/*"]
also_copy = ["tests"]
pytest_add_cli_args_test_selection = ["tests/estimation"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]

[tool.coverage.run]
source = ["mllm_shap"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true

[tool.logging]
version = 1
disable_existing_loggers = false

[tool.logging.formatters.standard]
format = "%(asctime)s %(levelname)s [%(name)s] %(message)s"

[tool.logging.handlers.console]
class = "logging.StreamHandler"
formatter = "standard"
stream = "ext://sys.stderr"

[tool.logging.loggers.mllm_shap]
level = "WARNING"
handlers = ["console"]
propagate = false

[tool.agent-kit.vault]
notes = ["knowledge"]
plans = ["plans"]
memory = [".remember"]
flat = ["plans", ".remember"]
isolated = ["knowledge"]

[tool.agent-kit.vault.schema]
dirs = ["knowledge"]
required = ["title", "type", "domain", "created", "parent"]
types = [
  "map", "dashboard", "module", "decision-log", "issue", "concept", "paper-list",
  "handbook", "solution", "plan", "generated",
]
link-fields = ["related-code"]
sections-exempt = ["Fixed issues"]

[tool.agent-kit.vault.schema.exempt]
parent = ["map"]
created = ["generated"]

[tool.agent-kit.vault.schema.statuses]
issue = ["open", "fixed", "wontfix", "deferred"]
plan = ["draft", "ready", "in progress", "done", "superseded"]

[tool.agent-kit.vault.schema.sections]
module = ["Responsibility", "Public surface", "Data flow", "Invariants", "Tests"]
issue = ["Symptom", "Cause", "Repro", "Fix"]
solution = ["Problem", "What was tried", "What worked", "Reusable rule"]

[tool.agent-kit.knowledge]
package = "src/mllm_shap"
generators = ["modules", "public-api"]
parent = "[[mllm-shap]]"
