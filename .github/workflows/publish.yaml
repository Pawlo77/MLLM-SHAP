name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
          version: "0.12.23"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Check the tag matches the project version
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match project version ${version}"
            exit 1
          fi

      - name: Sync dependencies
        run: uv sync --locked --all-groups --extra api --extra viz

      - name: Build
        run: uv build

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl python -c "import nlp_shap; print(nlp_shap.__version__)"

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz python -c "import nlp_shap; print(nlp_shap.__version__)"

      - name: Publish
        run: uv publish

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      # The full notes live in docs/release_notes.rst (published on the docs site).
      - name: Create GitHub Release
        run: >-
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
          --notes "Full release notes: https://pawlo77.github.io/nlp-shap/release_notes.html"
          dist/*
