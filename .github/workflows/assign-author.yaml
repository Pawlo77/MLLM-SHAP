# Assigns the PR author and sets one label from the title type (fix: bug, docs:
# documentation, every other type: enhancement). Skill `ship` does the same; this is the
# safety net.
name: Assign author

on:
  pull_request:
    types: [opened, reopened, edited]

permissions: {}

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      OWNER: ${{ github.repository_owner }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Assign the author and label from the title type
        run: |
          # Apps cannot be assigned with the workflow token; the owner takes their PRs.
          case "$AUTHOR" in *"[bot]") AUTHOR="$OWNER" ;; esac
          case "$TITLE" in
            fix:* | fix\(*) label=bug ;;
            docs:* | docs\(*) label=documentation ;;
            *) label=enhancement ;;
          esac
          for other in bug documentation enhancement; do
            if [ "$other" != "$label" ]; then
              gh pr edit "$PR" --remove-label "$other" 2>/dev/null || true
            fi
          done
          gh pr edit "$PR" --add-assignee "$AUTHOR" --add-label "$label"
