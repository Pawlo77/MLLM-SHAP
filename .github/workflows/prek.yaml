name: Prek Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-python: true
          version: "0.12.23"

      - name: Cache prek hook environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            prek-${{ runner.os }}-

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: |
          source scripts/hooks/kit_conf.sh
          # shellcheck disable=SC2046
          uv sync --locked --all-groups $(kit_conf ci-sync-args)

      - name: Run prek hooks
        run: uv run prek run --all-files

      - name: Vault check
        run: |
          source scripts/hooks/kit_conf.sh
          args="$(kit_conf vault-ci-args)"
          # shellcheck disable=SC2086
          [ -z "$args" ] || uv run python scripts/check_vault.py $args
