# Development config for the OpenAI-compatible HTTP backend (extra: mllm-shap[api]).
# Needs OPENAI_API_KEY (or MLLM_SHAP_API_KEY); see docs/guides/backends.rst.
# Point api_host at a local server (vLLM, LM Studio server mode) for offline runs.
# Run: mllm-shap explain --config config/dev_api.yaml --snapshot snapshot.json
backend:
  kind: api
  model_id: gpt-4o-mini
  api_host: https://api.openai.com/v1

generation:
  max_new_tokens: 32
  temperature: 0.0
  top_k: 1

explanation:
  estimand: shapley
  estimator: exact
  value_fn: tfidf_cosine
  normalizer: identity
  players: tokens
  absence_policy: pad
  budget:
    fraction: 1.0
  include_minimal_masks: false
  max_inflight: 2
  archive:
    path: ""
    flush_every: 50
    on_exists: overwrite
  dedup:
    enabled: auto
  kv_cache:
    enabled: false
  embedding_mode: static
  seed: 0
