# Development config for the in-process Hugging Face backend
# (extra: nlp-shap[transformers]). Tiny random model, CPU friendly; it exercises
# the prefix KV cache. Run the `gpu`-marked tests: uv run pytest -m gpu tests/
backend:
  kind: transformers
  model_id: hf-internal-testing/tiny-random-gpt2

generation:
  max_new_tokens: 8
  temperature: 0.0
  top_k: 1

explanation:
  estimand: shapley
  estimator: exact
  value_fn: tfidf_cosine
  normalizer: identity
  players: tokens
  absence_policy: pad
  budget:
    fraction: 1.0
  include_minimal_masks: false
  max_inflight: 1
  archive:
    path: ""
    flush_every: 50
    on_exists: overwrite
  dedup:
    enabled: auto
  kv_cache:
    enabled: true
  embedding_mode: static
  seed: 0
