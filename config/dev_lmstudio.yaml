# Development config for a local LM Studio (extra: nlp-shap[lmstudio]).
# Start LM Studio, then run the `lms`-marked tests: uv run pytest -m lms tests/
backend:
  kind: lmstudio
  model_id: qwen2-500m-instruct
  options:
    serialize_generate: true

generation:
  max_new_tokens: 32
  temperature: 0.0
  top_k: 1

explanation:
  estimand: shapley
  estimator: exact
  value_fn: tfidf_cosine
  normalizer: identity
  players: tokens
  absence_policy: pad
  budget:
    fraction: 1.0
  include_minimal_masks: false
  max_inflight: 2
  archive:
    path: ""
    flush_every: 50
    on_exists: overwrite
  dedup:
    enabled: auto
  kv_cache:
    enabled: false
  embedding_mode: static
  seed: 0
