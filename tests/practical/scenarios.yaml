# Practical scenario catalogue. Each id is a pytest marker argument
# (@pytest.mark.practical("<id>")) and the test id, so `make practical FEATURE=<glob>`
# and `-k` select it. A scenario's config is `defaults` deep-merged with `overrides`,
# then with each entry of `variants` for the extra runs a test makes. `expect` holds
# the thresholds the test asserts; a null in a variant deletes that key. tests/practical/test_catalog.py checks that every
# built-in plugin appears and that every id has a test.
defaults:
  generation: {max_new_tokens: 16, temperature: 0.0, top_k: 1}
  explanation:
    estimator: exact
    estimand: shapley
    value_fn: tfidf_cosine
    normalizer: identity
    players: tokens
    absence_policy: delete
    max_inflight: 1
    seed: 0
    archive: {path: ""}

snapshots:
  france: &france
    - [{role: user, text: The capital of France is}]
  multi_user: &multi_user
    - - {role: user, speaker: Alice, text: I ordered a pizza with extra cheese.}
      - {role: user, speaker: Bob, text: I ordered a green salad.}
      - {role: user, speaker: Carol, text: "What did Bob order? Answer in a few words."}
  three_turns: &three_turns
    - - {role: user, text: My name is Ola.}
      - {role: assistant, text: Nice to meet you!}
    - - {role: user, text: The weather is sunny today.}
      - {role: assistant, text: That sounds lovely.}
    - - {role: user, text: "What is my name?"}

scenarios:
  estimator.exact:
    tier: default
    turns: *france
    expect: {top_player: France, efficiency: 1.0e-9}
  estimator.mc:
    # Plain coalition sampling is noisier than the paired samplers: at 16 of the 32
    # coalitions 9 of 100 seeds met these bounds, at 28 85 of 100 (seed 0 included).
    tier: default
    turns: *france
    overrides: {explanation: {estimator: mc, budget: {evaluations: 28}}}
    expect: {top_k_signs: 3, max_l1: 0.35}
  estimator.complementary:
    tier: default
    turns: *france
    overrides: {explanation: {estimator: complementary, budget: {evaluations: 16}}}
    expect: {top_k_signs: 3, max_l1: 0.35}
  estimator.neyman_cc:
    tier: default
    turns: *france
    overrides: {explanation: {estimator: neyman_cc, budget: {evaluations: 16}}}
    expect: {top_k_signs: 3, max_l1: 0.35}
  estimand.banzhaf:
    tier: default
    turns: *france
    overrides: {explanation: {estimand: banzhaf}}
    variants:  # mc budget: see estimator.mc
      - {explanation: {estimator: mc, budget: {evaluations: 28}}}
    # Exact Banzhaf: France 0.227, "is" 0.200; mc at 28 kept France top in 45 of 100
    # seeds, in its top 3 in 100 and within L1 0.35 in 92.
    expect: {top_player: France, mc_top_k: 3, max_l1: 0.35}

  value.tfidf_cosine:
    tier: default
    turns: *france
    expect: {top_player: France}
  value.embedding_cosine:
    tier: default
    turns: *france
    overrides: {explanation: {value_fn: embedding_cosine}}
    expect: {agrees_with: value.tfidf_cosine}
  value.embedding_euclidean:
    tier: default
    turns: *france
    overrides: {explanation: {value_fn: embedding_euclidean}}
    expect: {agrees_with: value.tfidf_cosine}
  value.logprob:
    tier: default
    turns:
      - - {role: user, text: The capital of France is Paris.}
        - {role: user, text: "Correction: the capital of France is Berlin, not Paris."}
        - {role: user, text: "What is the capital of France? Answer with one word."}
    overrides: {explanation: {value_fn: logprob, players: messages}}
    expect: {contradiction: 1, sign: -1}
  value.normalizers:
    tier: fast
    turns: *france
    variants:
      - {explanation: {normalizer: abs_sum}}
      - {explanation: {normalizer: power_shift}}
      - {explanation: {normalizer: min_max}}
    expect: {}

  masking.delete:
    tier: default
    turns: *france
    expect: {top_player: France, empty_text: ""}
  masking.pad:
    tier: default
    turns: *france
    overrides: {explanation: {absence_policy: pad}}
    expect: {top_player: France, empty_text: "[MASK] [MASK] [MASK] [MASK] [MASK]"}
  masking.neutral:
    tier: default
    turns: *france
    overrides: {explanation: {absence_policy: neutral}}
    expect: {top_player: France, empty_text: "___ _______ __ ______ __"}
  partition.tokens:
    tier: default
    turns: *france
    expect: {labels: [The, capital, of, France, is]}
  partition.messages:
    tier: default
    turns:
      - - {role: system, text: You are a helpful assistant.}
        - {role: user, text: My favourite colour is green.}
        - {role: user, text: "What is my favourite colour?"}
    overrides:
      explanation:
        players: messages
        plugin_options: {messages: {roles: [user]}}
    # The question outweighs the fact: without it the model answers something else.
    expect: {players: 2, positive: [0, 1], top_player: 1}

  conversation.multi_turn:
    tier: default
    turns: *three_turns
    overrides:
      explanation:
        players: messages
        plugin_options: {messages: {roles: [user]}}
    expect: {answer: Ola, carrier: 0, distractor: 1}
  conversation.multi_user:
    tier: default
    turns: *multi_user
    overrides: {explanation: {players: messages}}
    expect: {answer: salad, bob: 1, alice: 0}
  conversation.system_prompt:
    tier: default
    turns:
      - - {role: system, text: Answer in French.}
        - {role: user, text: "What is the capital of Italy?"}
    overrides: {explanation: {players: messages}}
    expect: {system: 0}
  conversation.audio:
    tier: default
    turns:
      - [{role: user, text: Transcribe this recording.}]
    expect: {}

  backend.transformers:
    tier: default
    turns: *france
    expect: {answer: Paris}
  backend.transformers.kv_cache:
    # float32: cache on and off agree exactly. The float16 gap is recorded only:
    # see D04 in knowledge/issues/Fixed issues.md.
    tier: fast
    turns: *three_turns
    overrides:
      backend: {options: {dtype: float32}}
      explanation:
        players: messages
        kv_cache: {enabled: true}
    variants:
      - {explanation: {kv_cache: {enabled: false}}}
    expect: {}
  backend.lmstudio:
    tier: default
    turns: *france
    overrides: {explanation: {max_inflight: 4}}
    variants:
      - {explanation: {max_inflight: 1}}
    expect: {}
  backend.api:
    tier: default
    turns: *france
    overrides: {explanation: {max_inflight: 4}}
    expect: {}

  archive.reanalyze:
    tier: fast
    turns: *france
    overrides: {explanation: {value_fn: logprob}}
    expect: {}
  cli.explain:
    tier: fast
    turns: *france
    expect: {}
  cli.reanalyze:
    tier: fast
    turns: *france
    expect: {}
  alignment.sgpa:
    tier: fast
    turns:
      - [{role: user, text: "I had that curiosity beside me at this moment"}]
    # examples/data/voices_sp0307.wav: VOiCES corpus (Lab41, SRI), CC BY 4.0; the 3.4 s clip
    # of torchaudio's forced-alignment tutorial.
    expect: {audio: examples/data/voices_sp0307.wav, min_confidence: 0.8, longest: curiosity}
  partition.sgpa_segments:
    tier: fast
    turns: &voices
      - [{role: user, text: "I had that curiosity beside me at this moment"}]
    # No backend takes audio yet (issue D02): the mock backend scores the masked
    # transcripts while the real aligner builds the players and masks the audio.
    overrides:
      backend: {kind: mock, model_id: stub, options: null}
      explanation:
        players: sgpa_segments
        plugin_options:
          sgpa_segments:
            model_id: facebook/wav2vec2-base-960h
            revision: 22aad52d435eb6dbaf354bdad9b0da84ce7d6156
    expect: {audio: examples/data/voices_sp0307.wav}
  viz.render:
    tier: fast
    turns: *multi_user
    overrides: {explanation: {players: messages}}
    expect: {speakers: [Alice, Bob, Carol]}

  # Deep tier (`make practical TIER=deep`): Qwen2.5-3B is generator and judge.
  # Each test records its measured numbers in results/latest.json.
  deep.estimator.reference:
    tier: deep
    turns: &oslo
      - [{role: user, text: "Ada moved to Oslo in 1998. Where and when? Briefly."}]
    variants:  # the sampled estimators compared with the exact reference
      - {explanation: {estimator: mc}}
      - {explanation: {estimator: complementary}}
      - {explanation: {estimator: neyman_cc}}
    expect: {facts: [Oslo, "1998."], budgets: [32, 128, 512], seeds: 5, beats_mc: 4}
  deep.estimator.stability:
    tier: deep
    turns: *oslo
    variants:
      - {explanation: {estimator: mc}}
      - {explanation: {estimator: complementary}}
      - {explanation: {estimator: neyman_cc}}
    expect: {budget: 128, seeds: 5, top1_agreement: 0.8}
  deep.estimand.banzhaf:
    # Exact Banzhaf values are small and close (Oslo 0.047, Ada 0.038, 1998. 0.035;
    # sum 0.196), so mc at 128 is noise: median L1 1.10 (seeds 0.97-1.45), top-1
    # agreement 2/5. At 512: median 0.29, mc's top player in exact's top 3 on 5/5.
    tier: deep
    turns: *oslo
    overrides: {explanation: {estimand: banzhaf}}
    variants:
      - {explanation: {estimator: mc}}
    expect: {budgets: [128, 256, 512], seeds: 5, max_median_l1: 0.35, top3_hits: 4}
  deep.value.counterfactual:
    tier: deep
    turns:
      - [{role: user, text: "The meeting is on Monday. Which day?"}]
    variants:
      - {explanation: {value_fn: embedding_cosine}}
      - {explanation: {value_fn: embedding_euclidean}}
      - {explanation: {value_fn: logprob}}
    expect: {swap: [Monday, Friday], token: 4}
  deep.conversation.long:
    tier: deep
    turns: &long
      - - role: system
          text: >-
            You are the assistant of a small product team that plans a launch in one
            shared chat thread. Several colleagues write in the thread, and each
            message starts with the name of its author. Read the whole thread before
            you answer. Answer only the latest question, use only facts that someone
            stated in the thread, and never invent dates, names, places or numbers. If
            the thread does not contain the answer, say that you do not know. Keep
            replies short: one or two plain sentences, no lists, no headings and no
            greetings. Do not repeat the question, do not apologise, and do not add
            advice that nobody asked for. Write in English even when a colleague
            writes in another language. Rule: always end every reply with the single
            word DONE in capital letters.
        - {role: user, speaker: Alice, text: I booked the large room for the Tuesday design review.}
      - [{role: assistant, text: "Thanks, Alice, the room is booked. DONE"}]
      - [{role: user, speaker: Bob, text: Lunch on Tuesday is pizza from the place on Main Street.}]
      - [{role: assistant, text: "Noted, pizza on Tuesday. DONE"}]
      - [{role: user, speaker: Carol, text: We launch the product on Thursday.}]
      - [{role: assistant, text: "Thanks, Carol, noted. DONE"}]
      - [{role: user, speaker: Alice, text: The projector in the large room needs a new cable.}]
      - [{role: assistant, text: "I will tell the facilities team. DONE"}]
      - [{role: user, speaker: Bob, text: "My train arrives at nine, so I may be late on Tuesday."}]
      - [{role: user, speaker: Alice, text: "Which day do we launch the product? Reply in one sentence."}]
    overrides:
      generation: {max_new_tokens: 64}
      explanation:
        players: messages
        plugin_options: {messages: {roles: [user]}}
    variants:  # tokens of the decisive message only; message_index counts the system
      - explanation:
          players: focus_tokens
          plugin_options: {messages: null, focus_tokens: {message_index: 5}}
    expect: {decisive: 2, top_messages: 2, fact: Thursday., top_tokens: 3, rule: DONE}
  deep.conversation.speakers:
    tier: deep
    turns:
      - - {role: system, text: "Answer with the city only. Question: which city does Bob like most?"}
        - {role: user, speaker: Alice, text: My favourite city is Rome.}
        - {role: user, speaker: Bob, text: My favourite city is Tokyo.}
        - {role: user, speaker: Carol, text: My favourite city is Lima.}
    overrides:
      explanation:
        players: messages
        plugin_options: {messages: {roles: [user]}}
    expect: {answer: Tokyo, top: 1, speakers: [Alice, Bob, Carol]}
  deep.runtime.kv_cache:
    tier: deep
    turns: *long
    overrides:
      generation: {max_new_tokens: 64}
      explanation:
        players: messages
        plugin_options: {messages: {roles: [user]}}
        kv_cache: {enabled: true}
    variants:
      - {explanation: {kv_cache: {enabled: false}}}
    # M4 Pro, MPS: max gap 0.0138 in every run (greedy flips, issue D04; Qwen 1.5B
    # agrees exactly). Speed-up off/on after a warm-up generation: 1.17 (73.8 s /
    # 86.5 s); without it the first arm pays the warm-up and measures 0.93 to 1.02 (D05).
    expect: {max_gap: 0.02, min_speedup: 1.1}
  deep.runtime.dedup_archive:
    # mc draws distinct coalitions and messages render distinct chats: 0 of 64
    # deduplicated, archive 88 kB.
    tier: deep
    turns: *long
    overrides:
      generation: {max_new_tokens: 64}
      explanation:
        estimator: mc
        budget: {evaluations: 64}
        players: messages
        plugin_options: {messages: {roles: [user]}}
    variants:
      - {explanation: {value_fn: logprob}}
    expect: {}
  deep.cli.parity:
    tier: deep
    turns: *oslo
    overrides: {explanation: {estimator: neyman_cc, budget: {evaluations: 128}}}
    expect: {}
