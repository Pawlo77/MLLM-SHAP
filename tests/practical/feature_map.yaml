# Changed src path (fnmatch glob) -> practical feature ids, read by
# scripts/practical_features.py. Every glob a path matches adds its ids; `smoke` adds
# the smoke set, `none` adds nothing. Every src module must match at least one glob
# (tests/scripts/test_practical_features.py).
smoke: [estimator.exact, conversation.multi_turn, archive.reanalyze]

paths:
  src/mllm_shap/__init__.py: none
  src/mllm_shap/_logging.py: none
  src/mllm_shap/errors.py: none
  src/mllm_shap/protocols/*: none
  src/mllm_shap/cli.py: [cli.explain, cli.reanalyze]

  src/mllm_shap/backends/__init__.py: none
  src/mllm_shap/backends/mock/*: none
  src/mllm_shap/backends/_chat.py:
    [conversation.multi_user, conversation.system_prompt, conversation.audio, backend.api]
  src/mllm_shap/backends/api/*: [backend.api, conversation.audio]
  src/mllm_shap/backends/lmstudio/*: [backend.lmstudio, conversation.audio]
  src/mllm_shap/backends/transformers/*: [backend.transformers, backend.transformers.kv_cache, value.self_logprob, value.tf_logprob]
  src/mllm_shap/backends/transformers/audio.py: [conversation.audio]
  src/mllm_shap/backends/transformers/embeddings.py: [value.embedding_*]

  src/mllm_shap/alignment/*: [alignment.sgpa]
  src/mllm_shap/alignment/partitions.py: [alignment.sgpa, partition.sgpa_segments]

  src/mllm_shap/domain/*: smoke
  src/mllm_shap/domain/conversation.py: [conversation.*]
  src/mllm_shap/domain/players.py: [partition.*, viz.render]

  src/mllm_shap/estimation/__init__.py: none
  src/mllm_shap/estimation/_shared.py: [estimator.*]
  src/mllm_shap/estimation/exact.py: [estimator.exact]
  src/mllm_shap/estimation/monte_carlo.py: [estimator.mc, estimand.banzhaf]
  src/mllm_shap/estimation/complementary.py: [estimator.complementary]
  src/mllm_shap/estimation/neyman.py: [estimator.neyman_cc]
  src/mllm_shap/estimation/leverage.py: [estimator.leverage]
  src/mllm_shap/estimation/kernel_banzhaf.py: [estimator.kernel_banzhaf]
  src/mllm_shap/estimation/proxy.py: [estimator.proxy]
  src/mllm_shap/estimation/loo.py: [estimator.loo]
  src/mllm_shap/estimation/estimands/*: [estimator.exact, estimand.banzhaf]
  src/mllm_shap/estimation/normalizers.py: [value.normalizers]

  src/mllm_shap/masking/*: smoke
  src/mllm_shap/masking/policies.py: [masking.*, partition.sgpa_segments]
  src/mllm_shap/masking/audio.py: [partition.sgpa_segments]
  src/mllm_shap/masking/tokens.py: [masking.*, partition.tokens]
  src/mllm_shap/masking/partitions.py: [partition.*, conversation.multi_turn]

  src/mllm_shap/pipeline/*: smoke
  src/mllm_shap/pipeline/reanalyze.py: [archive.reanalyze, cli.reanalyze, value.normalizers]
  src/mllm_shap/pipeline/result.py: [cli.explain, viz.render]
  src/mllm_shap/pipeline/manifest.py: [cli.reanalyze]
  src/mllm_shap/pipeline/faithfulness.py: [value.reference_wer]

  src/mllm_shap/plugins/*: smoke
  src/mllm_shap/runtime/*: smoke
  src/mllm_shap/runtime/kv_cache.py: [backend.transformers.kv_cache]
  src/mllm_shap/runtime/scheduler.py: [backend.lmstudio]

  src/mllm_shap/value/*: [value.*]
  src/mllm_shap/viz/*: [viz.render]
  src/mllm_shap/viz/conversation.py: [viz.render, conversation.multi_user]
  src/mllm_shap/viz/audio.py: [alignment.sgpa]
