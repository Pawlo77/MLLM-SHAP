default_language_version:
  python: python3.12

default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

exclude: |
  (?x)^(
    docs/_build/|
    \.venv/|
    dist/|
    \.pytest_cache/|
    \.ruff_cache/|
    \.pytest_benchmark/|
    \.obsidian/plugins/[^/]+/(manifest\.json|main\.js|styles\.css)
  )

minimum_prek_version: "0.5.0"

ci:
  autofix_commit_msg: |
    [prek] auto fixes from pre-commit hooks
  autoupdate_commit_msg: |
    [prek] pre-commit autoupdate

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        # Generated jit-context indexes end in empty TSV columns.
        exclude: \.tsv$
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: forbid-new-submodules

  - repo: local
    hooks:
      - id: name-tests-test
        name: python tests naming
        entry: >-
          bash -c 'status=0; for f in "$@"; do base=$(basename "$f");
          case "$base" in conftest.py|__init__.py|_*) continue ;; test_*.py) ;; *)
          echo "Test files must be named test_*.py -> $f"; status=1;; esac; done;
          exit $status'
        language: system
        files: ^tests/.*\.py$
        pass_filenames: true

      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        always_run: false

      - id: strip-watermarks
        name: strip AI attribution watermarks
        entry: uv run python scripts/strip_watermarks.py
        language: system
        types: [text]
        exclude: ^(scripts/strip_watermarks\.py|tests/scripts/test_strip_watermarks\.py)$

      - id: memory-content-guard
        name: memory files contain no secrets or personal data
        entry: uv run python scripts/hooks/check_memory_files.py
        language: system
        files: ^(\.remember/|knowledge/).*\.md$

      - id: knowledge-build
        name: rebuild generated knowledge notes
        entry: uv run python scripts/build_knowledge.py
        language: system
        files: ^(src/|pyproject\.toml|tests/benchmarks/(baselines?|mutation-results)\.json|docs/release_notes\.rst|knowledge/(issues|decisions|architecture|concepts)/|\.claude/jit-context/)
        pass_filenames: false


      - id: vault-check
        name: vault consistency (notes, links, tags, generated notes)
        entry: bash -c 'uv run python scripts/check_vault.py --quiet --strict-tags && uv run python scripts/build_knowledge.py --check'
        language: system
        always_run: true
        pass_filenames: false

      - id: brevity
        name: brevity budgets (rule brevity)
        entry: uv run python scripts/check_brevity.py
        language: system
        files: \.(md|mdc|rst|py|ipynb)$
        pass_filenames: false

      - id: rules-sync
        name: Claude Code rules match Cursor rules
        entry: uv run python scripts/sync_rules.py --check
        language: system
        files: ^(\.cursor/rules/.*\.mdc|\.claude/rules/.*\.md|scripts/sync_rules\.py)$
        pass_filenames: false

      - id: agents-sync
        name: Codex agents match Claude Code agents
        entry: uv run python scripts/sync_agents.py --check
        language: system
        files: ^(\.claude/agents/.*\.md|\.codex/agents/.*\.toml|scripts/sync_agents\.py)$
        pass_filenames: false

      - id: skills-ref
        name: skills follow the Agent Skills spec
        entry: uv run pytest -q -p no:cacheprovider tests/skills/test_skill_frontmatter.py
        language: system
        files: ^(\.agents/skills/|\.claude/agents/|tests/skills/)
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy --config-file=pyproject.toml
        language: system
        files: ^src/
        pass_filenames: false

      - id: ty
        name: ty (advisory)
        entry: bash -c 'uv run ty check src || true'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: agent-check
        name: make agent-check (mirrors CI)
        entry: make agent-check
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: strip-watermarks-msg
        name: strip AI attribution from the commit message
        entry: uv run python scripts/strip_watermarks.py
        language: system
        stages: [commit-msg]
        always_run: true

      - id: conventional-commit-msg
        name: conventional commit message
        entry: python scripts/hooks/commit_msg.py
        language: system
        stages: [commit-msg]
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [-q, --min-severity=medium]
        files: ^\.github/workflows/[^/]+\.ya?ml$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        exclude: ^tests/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=nlp,shapley,shap,explainability,pyproject,toml,venv,prek,autosummary,intersphinx,napoleon,myst,pydata,sdist,wheel,readonly,kwargs,args,init,utils,backend,frontend,untracked,workflow,workflows,pytest,cov
        exclude: |
          (?x)^(
            uv\.lock|
            LICENSE|
            \.remember/|
            \.claude/jit-context/|
            docs/_build/|
            examples/.*\.ipynb
          )
